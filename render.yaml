services:
  - type: web
    name: fitbuddy-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WORKOUT_MODEL
        value: gemini-3.1-pro-preview
      - key: TIP_MODEL
        value: gemini-3.8-flash
